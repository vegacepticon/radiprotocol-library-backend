name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout backend
        uses: actions/checkout@v5

      - name: Read the pinned plugin rev
        id: pin
        run: echo "pin=$(grep -v '^#' plugin-pin.txt | grep -v '^$' | head -1 | tr -d '[:space:]')" >> "$GITHUB_OUTPUT"

      - name: Checkout the plugin at the pinned rev (read-only; the plugin repo is untouched)
        uses: actions/checkout@v5
        with:
          # Set the PLUGIN_REPO repository variable to the plugin's GitHub slug.
          repository: ${{ vars.PLUGIN_REPO || 'vegacepticon/RadiProtocol' }}
          ref: ${{ steps.pin.outputs.pin }}
          path: plugin-checkout

      - name: Install
        run: npm ci  # requires a committed package-lock.json

      - name: Typecheck
        run: npm run typecheck

      - name: Packages catalog validation (Variant B submission gate)
        run: npm run check:packages

      # NOTE: check:regen-diff is intentionally NOT part of CI. Submission PRs add
      # packages/ without regenerated site/ (the proxy cannot run the generator), so
      # a byte-diff gate would block every submission — and after merge it would block
      # main before the publish job can regenerate. The invariant "site/ matches
      # packages/" is enforced by the publish job below: it regenerates and bot-commits
      # site/ on every main push, overwriting any drift. Here we only prove the
      # generator runs cleanly on the submitted content.
      - name: Generator smoke on submitted packages
        if: ${{ github.event_name == 'pull_request' }}
        run: npm run generate

      - name: Wire-type parity (plugin ↔ backend, at the pinned rev)
        run: npm run check:wire-parity
        env:
          PLUGIN_REPO_PATH: plugin-checkout

      - name: Tests (catalog + generator + contract + seed)
        run: npm test

  # Variant B moderation automation: after a green main push, regenerate site/ from
  # packages/ and commit any changed bytes, then deploy to Cloudflare Pages. A moderator
  # merging a submission PR therefore publishes without running anything locally — the
  # merge commit's push triggers regen → commit → deploy.
  # The job is skipped on PR branches (github.ref != main). Needs `check` so it only runs
  # on an origin whose full pipeline already passed.
  publish:
    if: ${{ github.ref == 'refs/heads/main' }}
    needs: check
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout backend
        uses: actions/checkout@v5

      - name: Install
        run: npm ci

      - name: Regenerate site/ from packages/
        run: npm run generate

      - name: Commit regenerated site/ (if changed)
        id: commit
        run: |
          git config user.name "radiprotocol-bot"
          git config user.email "actions@users.noreply.github.com"
          if [[ -n "$(git status --porcelain site)" ]]; then
            git add site
            git commit -m "chore: regenerate site/ from packages/ (${GITHUB_SHA::7})"
            echo "committed=true" >> "$GITHUB_OUTPUT"
          else
            echo "committed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Push regenerated site/
        if: steps.commit.outputs.committed == 'true'
        # Branch ruleset requires the `check` status on every commit pushed to main;
        # this bot commit is created mid-run so it can never have one. Push under the
        # owner PAT instead: the main-protection ruleset grants the admin role
        # bypass:always, while everyone else still faces the required check.
        run: |
          git push "https://x-access-token:${{ secrets.ADMIN_PAT }}@github.com/${GITHUB_REPOSITORY}" HEAD:main

      - name: Deploy to Cloudflare Pages (radiprotocol.pages.dev)
        run: npm run deploy:pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
